<!-- Flash warning dialog. -->
<div id="warnModal" class="modal hidden">
  <div class="dialog">
    <div class="dlg-head">
      <h3>Are you sure?</h3>
      <button id="warnClose" class="icon" aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div class="warn-box">The developer assumes no responsibility for improper use. Flashing an incorrect file may permanently brick your device. Ensure target files are correct and do not interrupt the process during flashing.</div>
      <div class="dlg-section">
        <span class="dlg-label">TARGETS</span>
        <div id="warnTargets" class="warn-targets"></div>
      </div>
    </div>
    <div class="dlg-actions">
      <button id="warnCancel" class="refresh">Cancel</button>
      <button id="warnAgree" class="dlg-done" disabled>Confirm (10)</button>
    </div>
  </div>
</div>
